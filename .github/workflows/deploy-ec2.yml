name: Deploy to AWS EC2

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ec2-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          CI: false

      - name: Package release
        run: tar -czf release.tar.gz build server.js package.json package-lock.json

      - name: Upload release to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          source: release.tar.gz
          target: /tmp/portfolio-release

      - name: Install and restart application on EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_DIR: ${{ secrets.EC2_APP_DIR || '/var/www/portfolio' }}
          APP_PORT: ${{ secrets.EC2_APP_PORT || '5000' }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          envs: APP_DIR,APP_PORT
          script: |
            set -e
            mkdir -p "$APP_DIR"
            tar -xzf /tmp/portfolio-release/release.tar.gz -C "$APP_DIR"
            rm -f /tmp/portfolio-release/release.tar.gz
            cd "$APP_DIR"
            npm ci --omit=dev
            command -v pm2 >/dev/null 2>&1 || npm install --global pm2
            pm2 delete portfolio 2>/dev/null || true
            PORT="$APP_PORT" NODE_ENV=production pm2 start server.js --name portfolio
            pm2 save
            curl --fail --silent --show-error "http://localhost:${APP_PORT}/api/health" >/dev/null